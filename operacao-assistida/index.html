<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERA · Operação Assistida</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // Mesmo tema escolhido na Inteligência de Calls (preferência de UI, não dado de negócio).
  (function(){ var t='light'; try{ t=localStorage.getItem('tema')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); }catch(_){}
    document.documentElement.setAttribute('data-theme',t); })();
</script>
<style>
  :root{--bg:#F4F5F8;--navy:#141B3C;--muted:#6B7390;--accent:#DF1F2D;--line:rgba(20,27,60,.10)}
  :root[data-theme="dark"]{--bg:#0E1322;--navy:#EDF0F8;--muted:#8C93AE;--accent:#E8323F;--line:rgba(143,166,232,.12)}

  /* ===== Abertura (splash): logotipo ERA surge e desvanece ===== */
  #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg,#0E1322);
    transition:opacity .6s ease,visibility .6s;overflow:hidden}
  #splash::before{content:"";position:absolute;inset:-40px;background-image:linear-gradient(var(--line,rgba(128,140,180,.12)) 1px,transparent 1px),linear-gradient(90deg,var(--line,rgba(128,140,180,.12)) 1px,transparent 1px);
    background-size:40px 40px;opacity:.5;animation:splGrid 6s linear infinite}
  #splash.sai{opacity:0;visibility:hidden}
  #splash .spl-box{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;transition:transform .6s ease,filter .6s ease}
  #splash.sai .spl-box{transform:scale(1.05);filter:blur(3px)}
  #splash .spl-logo{width:min(240px,56vw);height:auto;color:var(--navy,#EDF0F8);
    clip-path:inset(0 100% 0 0);animation:splRevela .9s cubic-bezier(.7,0,.2,1) .15s forwards, splRespira 2.4s ease-in-out 1.1s infinite}
  #splash .spl-sub{font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.32em;text-transform:uppercase;color:var(--muted,#8C93AE);
    opacity:0;animation:splSobe .6s ease .75s forwards}
  #splash .spl-barra{width:160px;height:2px;background:var(--line,rgba(128,140,180,.2));border-radius:2px;overflow:hidden;opacity:0;animation:splSobe .4s ease .9s forwards}
  #splash .spl-barra i{display:block;height:100%;width:40%;background:var(--accent,#E8323F);animation:splCorre 1.1s ease-in-out infinite}
  @keyframes splRevela{to{clip-path:inset(0 0 0 0)}}
  @keyframes splRespira{0%,100%{opacity:1}50%{opacity:.7}}
  @keyframes splSobe{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes splCorre{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  @keyframes splGrid{to{transform:translate(40px,40px)}}
  @media(prefers-reduced-motion:reduce){#splash .spl-logo{clip-path:none;animation:none}#splash::before,#splash .spl-barra i{animation:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="spl-box"><svg class="spl-logo" aria-label="ERA" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127.60 23.68" fill="currentColor"><path d="M0.00 20.09L0.00 1.19C0.00 0.53 0.53 0.00 1.19 0.00L36.60 0.00C37.82 0.00 38.25 1.62 37.18 2.23L21.00 11.74C19.93 12.34 20.36 13.97 21.58 13.97L36.64 13.97C37.29 13.97 37.82 14.50 37.82 15.16L37.82 20.09C37.82 20.74 37.29 21.28 36.64 21.28L1.19 21.28C0.53 21.28 0.00 20.74 0.00 20.09M13.22 13.25L19.61 9.51C20.66 8.90 20.22 7.30 19.01 7.30L12.62 7.30C11.96 7.30 11.43 7.83 11.43 8.48L11.43 12.22C11.43 13.14 12.42 13.72 13.22 13.25Z" fill-rule="evenodd"/><path d="M79.51 23.35L59.62 14.92C58.92 14.62 58.68 13.75 59.12 13.13L61.62 9.22C62.19 8.43 61.62 7.33 60.66 7.33L52.49 7.36C51.83 7.36 51.22 7.90 51.22 8.55L51.22 20.09C51.22 20.74 50.69 21.28 50.03 21.28L40.98 21.28C40.33 21.28 39.79 20.74 39.79 20.09L39.79 1.19C39.79 0.53 40.33 0.00 40.98 0.00L78.41 0.00C79.38 0.00 79.94 1.10 79.38 1.88L74.13 9.22C73.67 9.86 73.94 10.76 74.68 11.03L80.39 13.42C80.86 13.60 81.16 14.04 81.16 14.54L81.16 22.25C81.16 23.10 80.29 23.68 79.51 23.35Z" fill-rule="evenodd"/><path d="M127.60 1.19L127.60 20.09C127.60 20.74 127.07 21.28 126.41 21.28L117.02 21.28C116.37 21.28 115.83 20.74 115.83 20.09L115.83 17.68C115.83 16.52 114.35 16.04 113.68 16.98L110.94 20.78C110.72 21.09 110.36 21.28 109.98 21.28L83.69 21.28C82.72 21.28 82.16 20.18 82.72 19.39L96.29 0.50C96.51 0.18 96.88 0.00 97.26 0.00L126.41 0.00C127.07 0.00 127.60 0.53 127.60 1.19M115.83 12.80L115.83 8.48C115.83 7.82 115.30 7.29 114.65 7.29L104.62 7.29C104.24 7.29 103.88 7.47 103.66 7.78L100.53 12.10C99.96 12.89 100.53 13.99 101.50 13.99L114.65 13.99C115.30 13.99 115.83 13.45 115.83 12.80Z" fill-rule="evenodd"/></svg><div class="spl-sub">Operação Assistida</div><div class="spl-barra"><i></i></div></div></div>
<script>
  // Abertura: completa na 1a visita da sessao (~1,5 s), curtinha nas seguintes. Sai quando a pagina termina de carregar.
  (function(){ var s=document.getElementById("splash"); var ja=false;
    try{ ja=sessionStorage.getItem("eraSplash")==="1"; sessionStorage.setItem("eraSplash","1") }catch(_){}
    var t0=Date.now(), min=ja?350:1500;
    function fecha(){ if(!s.isConnected) return; s.classList.add("sai"); setTimeout(function(){ s.remove() },700) }
    function sair(){ setTimeout(fecha, Math.max(0, min-(Date.now()-t0))) }
    if(document.readyState==="complete") sair(); else window.addEventListener("load", sair);
    setTimeout(fecha, 6000); // nunca prende a tela
  })();
</script>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
